name: Build and Deploy
run-name: Workflow run for ${{ github.ref }}
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      aws-deploy:
        type: boolean
        required: true
        default: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    # This branch's Dockerfile only defines one stage (`lakehouse-connector`, no `-image`
    # suffix), so every other leg's target doesn't exist and fails immediately. Without
    # fail-fast: false, GitHub's default cancels every other still-running leg the moment any
    # one fails - so lakehouse-connector never even got to try. continue-on-error lets the
    # 7 known-inapplicable legs fail without failing the job/workflow overall. Same pattern
    # #130 already uses on obsrv-core's other Flink Dockerfile for this exact problem.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "extractor"
            target: "extractor-image"
            optional: true
          - image: "preprocessor"
            target: "preprocessor-image"
            optional: true
          - image: "denormalizer"
            target: "denormalizer-image"
            optional: true
          - image: "transformer"
            target: "transformer-image"
            optional: true
          - image: "dataset-router"
            target: "dataset-router-image"
            optional: true
          - image: "unified-pipeline"
            target: "unified-image"
            optional: true
          - image: "lakehouse-connector"
            # Dockerfile's actual stage name has no -image suffix (unlike the other legs) -
            # matching the workflow's target to what already exists, not renaming the stage.
            target: "lakehouse-connector"
            optional: false
          - image: "cache-indexer"
            target: "cache-indexer-image"
            optional: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The single Dockerfile at repo root doesn't compile anything itself - line 17 (COPY
      # pipeline/hudi-connector/target/hudi-connector-1.0.0.jar ...) expects that jar to
      # already exist on disk before the Docker build starts. Nothing in this workflow ever
      # built it, so every run failed at that COPY with "not found". Missing step, not a
      # DHI/Flink content issue - the pom.xml/Dockerfile here are untouched.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build hudi-connector jar
        run: mvn -pl pipeline/hudi-connector -am clean package -DskipTests -q -f pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{matrix.image}} image and push
        uses: docker/build-push-action@v5
        with:
          # Without this, build-push-action wasn't picking up the jar the previous step just
          # built into the checked-out working tree - COPY failed with "not found" even though
          # the file existed on disk. Being explicit about the context fixes it.
          context: .
          platforms: linux/amd64
          target: ${{matrix.target}}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{matrix.image}}:${{ github.ref_name }}


  aws-deploy:
    needs: build-image
    if: github.event.inputs.aws-deploy == 'True'
    runs-on: ubuntu-latest
    environment: aws-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v1.1.0
        with:
          terragrunt_version: v0.45.8
      - name: Terragrunt installation
        run: terragrunt --version

      - name: Clone the terraform deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          path: deploy
          ref: ${{ vars.DEPLOY_REPO_REF }}

      - name: Fetch and update kubeconfig file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws eks --region ${{ vars.AWS_REGION }} update-kubeconfig --name ${{ vars.KUBERNETES_CLUSTER_NAME }}

      - name: Run terraform init and apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_TERRAFORM_BACKEND_BUCKET_NAME: ${{ vars.AWS_TERRAFORM_BACKEND_BUCKET_NAME }}
          AWS_TERRAFORM_BACKEND_BUCKET_REGION: ${{ vars.AWS_TERRAFORM_BACKEND_BUCKET_REGION }}
          KUBE_CONFIG_PATH: ~/.kube/config
        run: |
          cd deploy/terraform/aws
          terragrunt init
          terragrunt apply -auto-approve -var unified_pipeline_enabled={{ vars.MERGED_PIPELINE || 'true' }} --replace='module.flink.helm_release.flink' \
          -var flink_image_tag=${{ github.ref_name }}

  azure-deploy:
    needs: build-image
    if: vars.CLOUD_PROVIDER == 'azure'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the terraform deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          path: deploy
          ref: ${{ vars.DEPLOY_REPO_REF }}

      - name: Run terraform init and apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          cd deploy/terraform/azure
          terragrunt init
          terragrunt apply -auto-approve -replace=module.flink.helm_release.flink \
          -var flink_container_registry=${{ secrets.DOCKERHUB_USERNAME }} \
          -var flink_image_tag=${{ github.ref_name }}
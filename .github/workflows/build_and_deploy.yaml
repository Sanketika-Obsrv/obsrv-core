name: Build and Deploy
run-name: Workflow run for ${{ github.ref }}
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      aws-deploy:
        type: boolean
        required: true
        default: false
      only_lakehouse:
        description: "Manual test runs only: skip the 5 optional per-module legs (extractor/preprocessor/denormalizer/transformer/dataset-router), build just the 3 mandatory images (unified-pipeline, lakehouse-connector, cache-indexer). Has no effect on a tag push (real releases still build all 8)."
        type: boolean
        required: false
        default: false
      image_tag:
        description: "Manual test runs only: push under this Docker tag instead of the branch name (e.g. '2.2.0') - lets you test against an image tag your cluster expects without moving/creating a real git tag. Empty = use github.ref_name. Has no effect on a tag push (real releases always use the pushed git tag)."
        type: string
        required: false
        default: ""

jobs:
  build-image:
    runs-on: ubuntu-latest
    # optional legs (the individual pipeline modules) must not fail the workflow or block deploy;
    # unified-pipeline, cache-indexer, and lakehouse-connector are all mandatory - this reconciles
    # main's matrix (unified-pipeline + cache-indexer mandatory, no lakehouse-connector leg) with
    # this branch's (lakehouse-connector mandatory, cache-indexer optional) rather than picking
    # one side - both sets of stages now exist in the merged Dockerfile, so both sets of legs are
    # real. Previously diverged enough that a naive take-ours/take-theirs would have silently
    # dropped one side's mandatory image on this exact merge.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "extractor"
            target: "extractor-image"
            optional: true
          - image: "preprocessor"
            target: "preprocessor-image"
            optional: true
          - image: "denormalizer"
            target: "denormalizer-image"
            optional: true
          - image: "transformer"
            target: "transformer-image"
            optional: true
          - image: "dataset-router"
            target: "dataset-router-image"
            optional: true
          - image: "unified-pipeline"
            target: "unified-image"
            optional: false
          - image: "lakehouse-connector"
            target: "lakehouse-connector-image"
            optional: false
          - image: "cache-indexer"
            target: "cache-indexer-image"
            optional: false
    # only_lakehouse is workflow_dispatch-only (github.event.inputs is empty on a tag push, so
    # this is always true there and every leg still runs its steps, unaffected). matrix isn't
    # available in a job-level if:, so this is per-step instead - skips the real cost (checkout,
    # buildx, login, build+push) for the 7 legs that don't apply to this branch on a manual
    # test run, without touching the tag-push path any real release uses.
    steps:
      # Without this, a skipped leg's job still shows a plain green tick with zero executed
      # steps - indistinguishable in the checks list from a leg that actually built and pushed.
      # This step runs on exactly the opposite condition of every real step below, so exactly
      # one of the two branches is ever visible per leg.
      - name: Skipped (only_lakehouse dispatch mode)
        if: matrix.optional == true && github.event.inputs.only_lakehouse == 'true'
        run: echo "Skipped - manual only_lakehouse test run, this leg doesn't apply to this branch's Dockerfile. Unaffected on a real tag push."

      - uses: actions/checkout@v4
        if: matrix.optional == false || github.event.inputs.only_lakehouse != 'true'
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: matrix.optional == false || github.event.inputs.only_lakehouse != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to docker hub
        if: matrix.optional == false || github.event.inputs.only_lakehouse != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{matrix.image}} image and push
        if: matrix.optional == false || github.event.inputs.only_lakehouse != 'true'
        uses: docker/build-push-action@v5
        with:
          # Confirmed on a sibling branch: without this, build-push-action can resolve a
          # different context than the local checkout, missing files written by earlier
          # steps in this same job. Explicit context avoids that ambiguity.
          context: .
          platforms: linux/amd64
          target: ${{matrix.target}}
          push: true
          # github.event.inputs is empty on a real tag push, so this always falls through to
          # github.ref_name (the pushed tag) there, unaffected. image_tag only takes effect on
          # a manual workflow_dispatch run where it's explicitly set.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{matrix.image}}:${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.ref_name }}


  aws-deploy:
    needs: build-image
    if: github.event.inputs.aws-deploy == 'True'
    runs-on: ubuntu-latest
    environment: aws-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v1.1.0
        with:
          terragrunt_version: v0.45.8
      - name: Terragrunt installation
        run: terragrunt --version

      - name: Clone the terraform deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          path: deploy
          ref: ${{ vars.DEPLOY_REPO_REF }}

      - name: Fetch and update kubeconfig file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws eks --region ${{ vars.AWS_REGION }} update-kubeconfig --name ${{ vars.KUBERNETES_CLUSTER_NAME }}

      - name: Run terraform init and apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_TERRAFORM_BACKEND_BUCKET_NAME: ${{ vars.AWS_TERRAFORM_BACKEND_BUCKET_NAME }}
          AWS_TERRAFORM_BACKEND_BUCKET_REGION: ${{ vars.AWS_TERRAFORM_BACKEND_BUCKET_REGION }}
          KUBE_CONFIG_PATH: ~/.kube/config
        run: |
          cd deploy/terraform/aws
          terragrunt init
          terragrunt apply -auto-approve -var unified_pipeline_enabled={{ vars.MERGED_PIPELINE || 'true' }} --replace='module.flink.helm_release.flink' \
          -var flink_image_tag=${{ github.ref_name }}

  azure-deploy:
    needs: build-image
    if: vars.CLOUD_PROVIDER == 'azure'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the terraform deployment repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          path: deploy
          ref: ${{ vars.DEPLOY_REPO_REF }}

      - name: Run terraform init and apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          cd deploy/terraform/azure
          terragrunt init
          terragrunt apply -auto-approve -replace=module.flink.helm_release.flink \
          -var flink_container_registry=${{ secrets.DOCKERHUB_USERNAME }} \
          -var flink_image_tag=${{ github.ref_name }}
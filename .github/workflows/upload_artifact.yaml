name: Upload Artifacts
run-name: Workflow run for ${{ github.ref }}
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  artifacts-upload-core:
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Core Artifacts
        run: |
          mvn install -N -DskipTests
          mvn clean install -DskipTests -pl framework,dataset-registry

      - name: Stage Core Release Assets
        run: |
          mkdir -p release-assets
          cp ./framework/target/framework-1.0.0.jar release-assets/framework-${{ steps.get-tag.outputs.tag_name }}.jar
          cp ./dataset-registry/target/dataset-registry-1.0.0.jar release-assets/dataset-registry-${{ steps.get-tag.outputs.tag_name }}.jar

      - name: Publish Core Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true

  artifacts-upload-data-products:
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Data Products Artifacts
        run: |
          mvn install -N -DskipTests
          mvn install -DskipTests -pl framework,dataset-registry
          mvn clean package -DskipTests -f ./data-products/pom.xml

      - name: Get Data Products POM Version
        id: get-version
        run: echo "pom_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f ./data-products/pom.xml)" >>$GITHUB_OUTPUT

      - name: Stage Data Products Release Asset
        run: |
          mkdir -p release-assets
          cp ./data-products/target/data-products-${{ steps.get-version.outputs.pom_version }}.jar release-assets/data-products-${{ steps.get-tag.outputs.tag_name }}.jar

      - name: Publish Data Products Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true

  artifacts-upload-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Data Pipeline Artifacts
        run: mvn clean install -DskipTests

      - name: Stage Pipeline Release Assets
        run: |
          mkdir -p release-assets
          for img in extractor preprocessor denormalizer transformer dataset-router unified-pipeline cache-indexer; do
            cp ./pipeline/${img}/target/${img}-1.0.0.jar release-assets/${img}-${{ steps.get-tag.outputs.tag_name }}.jar
          done

      - name: Publish Pipeline Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true

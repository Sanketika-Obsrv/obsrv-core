name: Upload Artifacts
run-name: Workflow run for ${{ github.ref }}
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  artifacts-upload-core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Core Artifacts
        run: |
          mvn install -N -DskipTests
          mvn clean install -DskipTests -pl framework,dataset-registry

      - name: Stage Core Release Assets
        env:
          TAG_NAME: ${{ steps.get-tag.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          framework_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl framework)
          registry_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl dataset-registry)
          cp ./framework/target/framework-${framework_version}.jar "release-assets/framework-${TAG_NAME}.jar"
          cp ./dataset-registry/target/dataset-registry-${registry_version}.jar "release-assets/dataset-registry-${TAG_NAME}.jar"

      - name: Publish Core Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true

  artifacts-upload-data-products:
    runs-on: ubuntu-latest
    needs: artifacts-upload-core
    permissions:
      contents: write
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Data Products Artifacts
        run: |
          mvn install -N -DskipTests
          mvn install -DskipTests -pl framework,dataset-registry
          mvn clean package -DskipTests -f ./data-products/pom.xml

      - name: Get Data Products POM Version
        id: get-version
        run: echo "pom_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f ./data-products/pom.xml)" >>$GITHUB_OUTPUT

      - name: Stage Data Products Release Asset
        env:
          TAG_NAME: ${{ steps.get-tag.outputs.tag_name }}
          POM_VERSION: ${{ steps.get-version.outputs.pom_version }}
        run: |
          mkdir -p release-assets
          cp ./data-products/target/data-products-${POM_VERSION}.jar "release-assets/data-products-${TAG_NAME}.jar"

      - name: Publish Data Products Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true

  artifacts-upload-pipeline:
    runs-on: ubuntu-latest
    needs: artifacts-upload-data-products
    permissions:
      contents: write
    steps:
      - name: Get Tag Name
        id: get-tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >>$GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JAVA
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Data Pipeline Artifacts
        run: mvn clean install -DskipTests

      - name: Stage Pipeline Release Assets
        env:
          TAG_NAME: ${{ steps.get-tag.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          for img in extractor preprocessor denormalizer transformer dataset-router unified-pipeline cache-indexer; do
            module_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -pl pipeline/${img})
            cp ./pipeline/${img}/target/${img}-${module_version}.jar "release-assets/${img}-${TAG_NAME}.jar"
          done

      - name: Publish Pipeline Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-tag.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
